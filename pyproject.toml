[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alloy-core"
version = "0.1.0"
description = "Canonical PSPP Data Contracts, Adapters, and Event Bus for the Unified Alloy Intelligence Suite"
authors = [{ name = "Alloy Intelligence Suite Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov"
]
